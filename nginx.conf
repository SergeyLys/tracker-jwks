server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location = /.well-known/jwks.json {
        default_type application/json;
        add_header Cache-Control "public, max-age=60";
        try_files $uri =404;
    }

    location / {
        return 404;
    }
}
